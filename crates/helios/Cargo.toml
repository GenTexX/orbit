[package]
name = "helios"
version.workspace = true
edition.workspace = true

[dependencies]
# The script host compiles a node's .cmt through comet and runs it on wasmtime.
# comet writes WebAssembly and never executes it; owning the Engine is this
# crate's job (ADR 0002 - the editor embeds the same runtime a shipped game does).
comet = { version = "0.1.0", path = "../comet" }
wasmtime = "39"
glam = { version = "0.33.2", features = ["serde"] }
photon = { version = "0.1.0", path = "../photon" }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
slotmap = "1.1.1"
thiserror = "2.0.19"
toml = "1.1.3"

[dev-dependencies]
tempfile = "3.27.0"
