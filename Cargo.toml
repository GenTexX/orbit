[workspace]
resolver = "3"
members = [
    "crates/aether",
    "crates/aurora",
    "crates/aurora-wgpu",
    "crates/comet",
    "crates/photon",
    "crates/helios",
    "crates/voyager",
    "crates/atlas",
    "crates/prism",
    "crates/spectrum",
    "crates/sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Our own crates carry the interactive hot paths - aurora's layout and draw-list
# tree walks, spectrum's per-pixel gradient generation - so an unoptimized dev
# build makes the editor feel broken (measured 6-9x slower than opt-level 3, the
# difference between a smooth panel drag and one under 30 fps). opt-level 1 keeps
# inlining and the cheap passes while staying quick to compile and debuggable.
# Note this is NOT covered by the package."*" table below: that applies to
# dependencies only, never to workspace members.
[profile.dev]
opt-level = 1

# Dependencies get full optimization in dev too, so the sandbox and dev tools run
# fast (e.g. the sprite-field stress test). They change rarely, so the compile
# cost is paid once.
[profile.dev.package."*"]
opt-level = 3
