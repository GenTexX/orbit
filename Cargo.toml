[workspace]
resolver = "3"
members = [
    "crates/aether",
    "crates/aurora",
    "crates/aurora-wgpu",
    "crates/comet",
    "crates/photon",
    "crates/helios",
    "crates/voyager",
    "crates/atlas",
    "crates/prism",
    "crates/sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Optimize dependencies even in dev builds so the sandbox and dev tools run fast
# (e.g. the sprite-field stress test); our own crates stay at dev opt-level for
# quick incremental compiles.
[profile.dev.package."*"]
opt-level = 3
